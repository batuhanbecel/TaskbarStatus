name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build exe
        shell: cmd
        run: build.bat

      - name: Sign exe
        shell: pwsh
        run: ./tools/sign.ps1 -Files TaskbarStatus.exe

      - name: Build installer
        shell: cmd
        run: build-installer.bat --skip-exe

      - name: Sign installer
        shell: pwsh
        run: ./tools/sign.ps1 -Files (Get-ChildItem dist\TaskbarStatus-Setup-*.exe).FullName

      - uses: actions/upload-artifact@v7
        with:
          name: TaskbarStatus
          path: |
            TaskbarStatus.exe
            dist/TaskbarStatus-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/TaskbarStatus-Setup-*.exe
            TaskbarStatus.exe
          generate_release_notes: true

      - name: Submit to winget
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./tools/winget.ps1 -Version $version -InstallerPath "dist/TaskbarStatus-Setup-$version.exe" -Submit
